# Serves the built app on 8501 and forwards /api/ to the FastAPI backend.
server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/expenditures/ -> http://backend:8000/expenditures/ (the trailing
    # slash on proxy_pass strips the /api prefix).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Publishing to Tableau runs inside the request and can take a while.
        proxy_read_timeout 300s;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single page (the router lives in the URL hash),
    # never cached so a rebuild reaches phones on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
