services:
  # --------------------------------------------------------
  #  1. Database (Postgres)
  # --------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: personal_finance_db
    restart: unless-stopped # come back after a reboot or crash; `docker compose stop` still stops it
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432" # Map local port to the container (5433)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  #  2. Backend (FastAPI)
  # --------------------------------------------------------
  backend:
    build: ./backend  # Tells Docker to build the image from the ./backend folder
    container_name: personal_finance_api
    restart: unless-stopped # come back after a reboot or crash; `docker compose stop` still stops it
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - 8000:8000 # Open port 8000 so that we can test the API in the browser
    volumes:
      - ./backend:/app # Mounts your local code for live-reloading
    env_file:
      - ./.env        # Passes the .env file to the container
    depends_on:
      db:
        condition: service_healthy # Waits for the healthcheck to pass
    environment:
      - DB_HOST=db
      - DB_PORT=5432

  # --------------------------------------------------------
  #  Backups: a compressed pg_dump when it starts and every day after,
  #  into BACKUP_DIR (default ./backups, gitignored), keeping BACKUP_KEEP_DAYS.
  #  Point BACKUP_DIR at a folder that syncs to the cloud (OneDrive...) so a
  #  copy leaves this PC. Restore: see "Backups" in CLAUDE.md.
  # --------------------------------------------------------
  backup:
    image: postgres:15-alpine  # the same pg_dump as the database
    container_name: personal_finance_backup
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=${DB_NAME}
      - KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
      - EVERY_SECONDS=${BACKUP_EVERY_SECONDS:-86400}
      - TZ=America/Sao_Paulo  # file names in São Paulo time
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    # Inline rather than a script file: a bind-mounted script checked out with
    # Windows line endings would not run in the Linux container.
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file="/backups/home_finances_$$(date +%Y-%m-%d_%H%M).dump"
          if pg_dump --format=custom --file="$$file.part" && mv "$$file.part" "$$file"; then
            echo "backup written: $$file"
          else
            echo "backup FAILED" >&2
            rm -f "$$file.part"
          fi
          find /backups -name 'home_finances_*.dump' -mtime +"$$KEEP_DAYS" -delete
          sleep "$$EVERY_SECONDS"
        done

# PGAdmin service
  pgadmin:
    image: dpage/pgadmin4
    container_name: personal_finance_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 5050:80 # Maps PGAdmin to localhost:5050
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: personal_finance_frontend
    restart: unless-stopped # come back after a reboot or crash; `docker compose stop` still stops it
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app # Hot Reload for streamlit. Change code, refresh browser, and see changes.
    env_file:
      - .env
    depends_on:
      - backend # Waits for API to start
    environment:
      # Override networking magic
      # Use the service name (backend) defined above
      - API_URL=http://backend:8000

volumes:
  postgres_data: